---
# Set up the entire home lab in one pass:
#   ansible-playbook playbooks/setup-homelab.yml
#
# Or run specific tags:
#   ansible-playbook playbooks/setup-homelab.yml --tags k3s
#   ansible-playbook playbooks/setup-homelab.yml --tags nvidia

- name: Base configuration for all nodes
  hosts: homelab
  roles:
    # - role: base_packages
    - role: passwordless_sudo
    - role: auto_update
    - role: silent_motd
  tags: [base]

# - name: Update and upgrade APT packages
#   hosts: homelab
#   become: true
#   tasks:
#     - name: Update the APT package index
#       ansible.builtin.apt:
#         update_cache: true

#     - name: Upgrade all APT packages
#       ansible.builtin.apt:
#         upgrade: true
#         autoclean: true
#         autoremove: true
#   tags: [base]

- name: Apply security updates
  hosts: homelab
  become: true
  roles:
    - security_updates
  tags: [base, security]

- name: Reboot after base configuration
  hosts: homelab
  tasks:
    - name: Reboot and wait for server to come back
      ansible.builtin.reboot:
        reboot_timeout: 300
  tags: [reboot, never]

# Split into two plays: the etcd-bootstrapping node must fully finish
# installing k3s before the joining servers even start their play. In a
# single shared play, Ansible's linear strategy runs each task in lockstep
# across all hosts — the joining servers' "wait for initial server" task
# (blocks up to 600s) would prevent this node's own "install k3s server"
# task from ever starting, since that task can't begin for ANY host until
# every host has passed the previous task. That's exactly the deadlock
# that caused zyron/nova to time out waiting for a core-01 that could
# never start.
- name: k3s server (etcd-bootstrapping node)
  hosts: k3s_server_init
  roles:
    - role: k3s-server
  tags: [k3s, k3s-server]

- name: k3s server (joining nodes)
  hosts: k3s_server:!k3s_server_init
  roles:
    - role: k3s-server
  tags: [k3s, k3s-server]

- name: k3s agents
  hosts: k3s_agents
  roles:
    - role: k3s-agent
  tags: [k3s, k3s-agent]

# Runs after both k3s plays above — restarts whichever k3s service
# (server or agent) is actually installed on the target, so this must run
# once that's in place.
- name: NVIDIA runtime
  hosts: gpu_nodes
  roles:
    - role: nvidia-runtime
  tags: [nvidia]

- name: Cluster add-ons (run on server)
  hosts: k3s_server
  roles:
    - role: kueue
    - role: headlamp
  tags: [addons]
