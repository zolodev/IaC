---
# Set the timezone on all home lab nodes and any generic Ubuntu hosts.
# Split into its own playbook because the reboot task would otherwise inherit
# whatever tag its containing play was given (e.g. "base"), silently
# defeating the task's own "never" tag.
#
#   ansible-playbook playbooks/timezone.yml
#   ansible-playbook playbooks/timezone.yml --tags reboot   # also reboot to apply

- name: Set timezone
  hosts: homelab:ubuntu
  become: true
  tasks:
    - name: Set timezone to Europe/Stockholm
      ansible.builtin.command:
        cmd: timedatectl set-timezone Europe/Stockholm

    - name: Ensure locales package is installed
      ansible.builtin.apt:
        name: locales
        state: present

    - name: Generate en_US.UTF-8 locale
      ansible.builtin.command:
        cmd: locale-gen en_US.UTF-8

    - name: Reconfigure locales
      ansible.builtin.command:
        cmd: dpkg-reconfigure locales
        creates: /etc/locale.gen

    - name: Update locale settings
      ansible.builtin.copy:
        dest: /etc/default/locale
        content: |
          LANG=en_US.UTF-8
          LANGUAGE=en_US:en
          LC_ALL=en_US.UTF-8

    - name: Ensure /etc/locale.gen is configured
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: "^en_US.UTF-8 UTF-8"
        line: "en_US.UTF-8 UTF-8"
        state: present

    - name: Regenerate locales
      ansible.builtin.command:
        cmd: locale-gen

    - name: Reboot to apply locale settings
      ansible.builtin.reboot:
        msg: "Rebooting to apply locale settings"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      tags: [reboot, never]
