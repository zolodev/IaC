---
# ── k3s ──────────────────────────────────────────────────────────────────────
k3s_version: "v1.31.4+k3s1"
k3s_token: "{{ vault_k3s_token }}"          # stored in ansible-vault
# Derived from the k3s_server_init inventory group (the etcd-bootstrapping
# node — see roles/k3s-server/tasks/main.yml and prod.ini) rather than
# hardcoded, so it always matches whatever that host's ansible_host actually
# is. Must be that host's Tailscale IP, not a LAN address it advertises a
# route to itself — otherwise the moment its own route advertisement gets
# cleared (k3s's CNI churn on install/uninstall does this as a side effect),
# every other server node loses the address it uses to join/rejoin it too.
k3s_server_ip: "{{ hostvars[groups['k3s_server_init'][0]].ansible_host }}"
k3s_server_url: "https://{{ k3s_server_ip }}:6443"

# k3s-agent hosts (worker-01/02) are plain Proxmox VMs with no Tailscale
# client at all — they're colocated with core-01 on the same LAN and can
# only reach it via its LAN address, never its Tailscale IP. k3s_server_url
# above is for cross-network joins (zyron/nova); this is for LAN-local
# agents specifically. Set via k3s_lan_ip on the k3s_server_init host.
k3s_server_lan_ip: "{{ hostvars[groups['k3s_server_init'][0]].k3s_lan_ip }}"
k3s_server_lan_url: "https://{{ k3s_server_lan_ip }}:6443"

# ── Garage S3 ─────────────────────────────────────────────────────────────────
garage_version: "v1.0.1"
garage_data_dir: "/var/lib/garage"
garage_rpc_bind: "0.0.0.0:3901"
garage_s3_bind: "0.0.0.0:3900"
garage_region: "garage"
# Provisioned automatically by playbooks/setup-garage.yml for the paradise
# project's S3 sync (models_base/models_ft/data/logs) — see
# paradise/scripts/k8s-entrypoint.sh and paradise/k8s/secret.yaml.
garage_paradise_bucket: "paradise"
garage_paradise_key: "paradise"

# ── k3s inter-node firewall ──────────────────────────────────────────────────
# See playbooks/k3s-firewall.yml. Only affects hosts that already run ufw.
k3s_firewall_state: "present"        # or "absent" via -e to remove the rules
k3s_firewall_src:   "100.64.0.0/10"  # Tailscale CGNAT range — all cluster nodes live here
k3s_firewall_server_ports:
  - { port: "6443",      proto: tcp, comment: "k3s API server" }
  - { port: "2379:2380", proto: tcp, comment: "etcd client+peer" }
  - { port: "10250",     proto: tcp, comment: "kubelet" }
  - { port: "8472",      proto: udp, comment: "flannel VXLAN" }
k3s_firewall_agent_ports:
  - { port: "10250", proto: tcp, comment: "kubelet" }
  - { port: "8472",  proto: udp, comment: "flannel VXLAN" }

# ── Kueue ─────────────────────────────────────────────────────────────────────
kueue_version: "0.9.1"

# ── Headlamp ──────────────────────────────────────────────────────────────────
# NodePort in range 30000–32767. Access at http://<zyron-ip>:30800
headlamp_nodeport: 30800

# ── Common ────────────────────────────────────────────────────────────────────
timezone: "Europe/Stockholm"
specific_user: "zolo"
