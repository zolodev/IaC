# hosts.example.ini — inventory template for this project
#
# Copy to prod.ini and fill in real IPs before running any playbook:
#
#   cp inventory/hosts.example.ini prod.ini
#
# prod.ini is gitignored (covered by *.ini) — never committed to git.
# run.sh creates and opens prod.ini automatically on first run.
#
# Format: INI-style Ansible inventory.
# Each line under a group header is: <alias> <var>=<value> ...
#
# Common per-host variables used here:
#   ansible_host  — the IP address or hostname Ansible connects to
#   ansible_user  — the SSH user (must have passwordless sudo, see prep playbook)
#   k3s_role      — custom var used by roles to distinguish server vs agent
#
# Groups can inherit members from other groups via [group:children].
# This lets playbooks target e.g. "homelab" to reach all nodes at once.
#
# Full inventory reference:
#   https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html

# ── k3s control plane ────────────────────────────────────────────────────────
# The server nodes run the k3s API (embedded etcd HA) and, unless marked
# control_plane_only, also schedule workloads.
# One server must set k3s_cluster_init=true — it bootstraps the etcd
# cluster. Every other server joins it via --server (handled automatically
# by the k3s-server role using k3s_server_ip/k3s_server_url).
#
# tailscale_advertise_routes (optional) — if this node also advertises a
# Tailscale subnet route, set its CIDR here. k3s's CNI (flannel) interface
# churn on install/uninstall causes tailscaled to clear that advertisement
# as a side effect; the k3s-server role and revert-k3s.yml both re-apply
# it automatically afterward when this var is set.
[k3s_server]
zyron   ansible_host=192.168.1.x  ansible_user=zolo k3s_role=server
nova    ansible_host=100.x.x.x    ansible_user=zolo k3s_role=server
core-01 ansible_host=192.168.1.x  ansible_user=zolo k3s_role=server k3s_control_plane_only=true k3s_cluster_init=true tailscale_advertise_routes=192.168.1.0/24

# The etcd-bootstrapping node (k3s_cluster_init=true above) — must be a
# separate group so its own play runs to completion before the joining
# servers' play starts. In a single shared play, Ansible's linear strategy
# runs each task in lockstep across all hosts, so the joining servers'
# "wait for initial server" task (which blocks for up to 600s) would
# prevent this node's own "install k3s server" task from ever starting —
# a deadlock. Whichever host(s) above have k3s_cluster_init=true go here.
[k3s_server_init]
core-01

# ── k3s agents ───────────────────────────────────────────────────────────────
# Agent-only nodes: join the cluster and run workloads, but never run the
# k3s control plane. zyron and nova are NOT listed here even though they run
# workloads too — they're full k3s_server nodes (no k3s_control_plane_only
# taint), so k3s's embedded kubelet already makes them schedulable. Adding
# them here as well makes the k3s-agent role try to install a *second*,
# separate k3s-agent systemd unit on top of the k3s.service the server role
# already installed — its "creates: /usr/local/bin/k3s" guard then skips the
# actual agent install (the binary's already there from the server install),
# so the k3s-agent service the next task expects never gets created, and
# that task fails with "Could not find the requested service k3s-agent".
# worker-01/02 are Proxmox VMs on the local network with no control-plane role.
[k3s_agents]
worker-01 ansible_host=192.168.1.x  ansible_user=zolo k3s_role=agent
worker-02 ansible_host=192.168.1.x  ansible_user=zolo k3s_role=agent

# ── GPU nodes ────────────────────────────────────────────────────────────────
# Subset of agents that have a GPU — used to target NVIDIA-specific roles.
[gpu_nodes]
zyron

# ── Garage S3 ────────────────────────────────────────────────────────────────
# Nodes that run the Garage self-hosted S3 service.
[garage]
nova

# ── All home lab nodes ────────────────────────────────────────────────────────
# Convenience group that covers the entire home lab.
# Used by base configuration plays (timezone, apt, motd).
[homelab:children]
k3s_server
k3s_agents

# ── Local control node (self-targeting) ───────────────────────────────────────
# Use this group in playbooks that should run on the Ansible control host itself
# using a local connection (no SSH). Useful for setup tasks on the machine
# running ansible-playbook.
[ansible_local]
localhost ansible_connection=local ansible_host=127.0.0.1 ansible_python_interpreter=/usr/bin/python3

# ── Generic Ubuntu hosts ──────────────────────────────────────────────────────
# Add any Ubuntu machines here that don't fit the k3s groups above.
# Uncomment and fill in real IPs.
[ubuntu]
; myserver ansible_host=192.168.1.x ansible_python_interpreter=/usr/bin/python3

[ubuntu:vars]
specific_user=zolo
