---
# Set up the entire home lab in one pass:
#   ansible-playbook playbooks/setup-homelab.yml
#
# Or run specific tags:
#   ansible-playbook playbooks/setup-homelab.yml --tags k3s
#   ansible-playbook playbooks/setup-homelab.yml --tags nvidia

- name: Base configuration for all nodes
  hosts: homelab
  roles:
    # - role: base_packages
    - role: passwordless_sudo
    - role: auto_update
    - role: silent_motd
  tags: [base]

# - name: Update and upgrade APT packages
#   hosts: homelab
#   become: true
#   tasks:
#     - name: Update the APT package index
#       ansible.builtin.apt:
#         update_cache: true

#     - name: Upgrade all APT packages
#       ansible.builtin.apt:
#         upgrade: true
#         autoclean: true
#         autoremove: true
#   tags: [base]

- name: Apply security updates
  hosts: homelab
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Run unattended-upgrades for security patches only
      ansible.builtin.command:
        cmd: unattended-upgrade --verbose

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure fail2ban bantime and escalation
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/customisations.local
        content: |
          [DEFAULT]
          bantime = 1h
          bantime.increment = true
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true
  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
  tags: [base, security]

- name: Reboot after base configuration
  hosts: homelab
  tasks:
    - name: Reboot and wait for server to come back
      ansible.builtin.reboot:
        reboot_timeout: 300
  tags: [reboot, never]

- name: k3s server (Jetson)
  hosts: k3s_server
  roles:
    - role: k3s-server
  tags: [k3s, k3s-server]

- name: NVIDIA runtime (Jetson)
  hosts: gpu_nodes
  roles:
    - role: nvidia-runtime
  tags: [nvidia]

- name: k3s agents (Zimaboards + zh)
  hosts: k3s_agents
  roles:
    - role: k3s-agent
  tags: [k3s, k3s-agent]

- name: Cluster add-ons (run on server)
  hosts: k3s_server
  roles:
    - role: sealed-secrets
    - role: kueue
    - role: headlamp
  tags: [addons]
