---
# Install Headlamp (Kubernetes dashboard, NodePort 30800) on the k3s server
# nodes. Kept separate from setup-homelab.yml so it can be installed/
# reinstalled on its own, without touching k3s or anything else.
#
#   ansible-playbook playbooks/headlamp.yml -i prod.ini
#   ./run.sh headlamp

- name: Headlamp
  hosts: k3s_server
  roles:
    - role: headlamp
