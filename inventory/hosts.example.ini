# hosts.example.ini — inventory template for this project
#
# Copy to prod.ini and fill in real IPs before running any playbook:
#
#   cp inventory/hosts.example.ini prod.ini
#
# prod.ini is gitignored (covered by *.ini) — never committed to git.
# run.sh creates and opens prod.ini automatically on first run.
#
# Format: INI-style Ansible inventory.
# Each line under a group header is: <alias> <var>=<value> ...
#
# Common per-host variables used here:
#   ansible_host  — the IP address or hostname Ansible connects to
#   ansible_user  — the SSH user (must have passwordless sudo, see prep playbook)
#   k3s_role      — custom var used by roles to distinguish server vs agent
#
# Groups can inherit members from other groups via [group:children].
# This lets playbooks target e.g. "homelab" to reach all nodes at once.
#
# Full inventory reference:
#   https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html

# ── k3s control plane ────────────────────────────────────────────────────────
# The server node runs the k3s API and schedules workloads.
# Jetson acts as both server and agent (it also runs workloads itself).
[k3s_server]
jetson ansible_host=192.168.1.x ansible_user=zolo k3s_role=server

# ── k3s agents ───────────────────────────────────────────────────────────────
# Agent nodes join the cluster and run workloads.
# zh connects over a Headscale VPN — use its Tailscale/Headscale IP here.
# zima-1..4 are Proxmox VMs on the local network.
[k3s_agents]
zh     ansible_host=100.x.x.x   ansible_user=zolo k3s_role=agent
zima-1 ansible_host=192.168.1.x ansible_user=zolo k3s_role=agent
zima-2 ansible_host=192.168.1.x ansible_user=zolo k3s_role=agent
zima-3 ansible_host=192.168.1.x ansible_user=zolo k3s_role=agent
zima-4 ansible_host=192.168.1.x ansible_user=zolo k3s_role=agent

# ── GPU nodes ────────────────────────────────────────────────────────────────
# Subset of agents that have a GPU — used to target NVIDIA-specific roles.
[gpu_nodes]
jetson

# ── Garage S3 ─────────────────────────────────────────────────────────────────
# Nodes that run the Garage self-hosted S3 service.
[garage]
zh

# ── All home lab nodes ────────────────────────────────────────────────────────
# Convenience group that covers the entire home lab.
# Used by base configuration plays (timezone, apt, motd).
[homelab:children]
k3s_server
k3s_agents
