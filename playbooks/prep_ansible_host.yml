---
# Bootstrap Jetson as the Ansible control node.
#
# Run this ONCE from your local machine (or any machine with SSH access to Jetson):
#   ./run.sh prep --ask-become-pass
#
# After this playbook completes:
#   - Ansible is installed on Jetson
#   - The IaC repo is cloned at ~/iac
#   - Passwordless sudo is configured (no --ask-become-pass needed for future runs)
#   - SSH into Jetson and run all future playbooks from there:
#       ssh zolo@<jetson-ip>
#       cd ~/iac
#       ./run.sh homelab

- name: Bootstrap Ansible control node
  hosts: ansible_controller
  become: true
  tasks:
    - name: Ensure python3 and python3-pip
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - git
        state: present
        update_cache: true

    - name: Upgrade pip
      ansible.builtin.command:
        cmd: python3 -m pip install --upgrade pip
      changed_when: true

    - name: Install Ansible
      ansible.builtin.pip:
        name: ansible
        state: latest

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/{{ specific_user }}
        line: "{{ specific_user }} ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Clone IaC repository
      ansible.builtin.git:
        repo: "https://github.com/zolodev/iac.git"
        dest: "/home/{{ specific_user }}/iac"
        update: false
      become: false
