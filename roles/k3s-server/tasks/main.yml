---
# Runs every step in order, unconditionally — this is the entrypoint used
# by the normal setup-homelab.yml flow. For manual step-by-step debugging
# where you want to comment out individual steps, use
# playbooks/k3s-server-debug.yml instead, which imports these same step
# files (plus the tailscale-routes-guard checkpoints below) one line at a
# time so any of them can be disabled without touching this file.

- name: Tailscale route check — before anything
  ansible.builtin.include_role:
    name: tailscale-routes-guard
  vars:
    checkpoint: "k3s-server: before install"

- import_tasks: steps/01_download_install_script.yml
- import_tasks: steps/02_wait_for_initial_server.yml
- import_tasks: steps/03_install_k3s_server.yml

- name: Tailscale route check — after install command
  ansible.builtin.include_role:
    name: tailscale-routes-guard
  vars:
    checkpoint: "k3s-server: after install command"

- import_tasks: steps/04_ensure_service_running.yml

- name: Tailscale route check — after service start
  ansible.builtin.include_role:
    name: tailscale-routes-guard
  vars:
    checkpoint: "k3s-server: after service start"

- import_tasks: steps/05_wait_for_k3s_ready.yml

# k3s's CNI (flannel) brings up cni0/flannel.1/veth* interfaces as it
# starts, then tears part of that down again once its own networking
# settles — tailscaled treats that interface churn as a LinkChange event
# and, at least in this setup, explicitly clears its own AdvertiseRoutes
# preference in response (confirmed via tailscaled's logs: an
# EditPrefs{AdvertiseRoutes=[]} entry lands right as flannel's interfaces
# disappear). This checkpoint is the one most likely to catch it, since
# flannel's interfaces have had the most time to churn by now — but it's
# checked at every step above too, so the play output shows exactly which
# one actually cleared it.
- name: Tailscale route check — after k3s ready
  ansible.builtin.include_role:
    name: tailscale-routes-guard
  vars:
    checkpoint: "k3s-server: after k3s ready"

- import_tasks: steps/06_kubeconfig.yml
- import_tasks: steps/07_print_token.yml
