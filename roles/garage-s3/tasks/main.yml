---
- name: Create garage user
  user:
    name: garage
    system: yes
    shell: /sbin/nologin
    home: "{{ garage_data_dir }}"
    create_home: yes

- name: Check whether ufw is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: _ufw_bin

- name: Allow Garage RPC + S3 API ports through ufw (only on hosts that already run it)
  # Same class of gap as k3s's ports (see roles/k3s-firewall): a host with
  # an unrelated pre-existing ufw config silently blocks Garage's inter-
  # node RPC (3901) and S3 API (3900) with no error beyond a timeout when
  # another node tries to connect. Never installs/enables ufw itself.
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: "{{ k3s_firewall_src | default('100.64.0.0/10') }}"
    comment: "Garage"
  loop: ["3900", "3901"]
  when: _ufw_bin.stat.exists

- name: Ensure the Garage data dir's parent is traversable by the garage user
  # garage_data_dir can be overridden per-host to a path outside /var/lib
  # (e.g. zyron -> /mnt/nvme/garage). If that parent directory itself isn't
  # world-traversable (e.g. /mnt/nvme is 0700, owned by another user), the
  # garage service user can reach garage_data_dir by name but still gets
  # "Permission denied" opening anything under it — traversal permission is
  # checked on every path component, not just the final directory. Grant
  # execute-only (traverse, not list/read) on the parent; contents keep
  # whatever perms they already have.
  ansible.builtin.file:
    path: "{{ garage_data_dir | dirname }}"
    state: directory
    mode: "o+x"
  when: (garage_data_dir | dirname) not in ['/', '/var', '/var/lib']

- name: Create garage directories
  file:
    path: "{{ item }}"
    state: directory
    owner: garage
    group: garage
    mode: "0750"
  loop:
    - "{{ garage_data_dir }}"
    - "{{ garage_data_dir }}/meta"
    - "{{ garage_data_dir }}/data"
    - /etc/garage

- name: Set Garage architecture
  set_fact:
    garage_arch: "{{ 'x86_64' if ansible_architecture == 'x86_64' else 'aarch64' }}-unknown-linux-musl"

- name: Download Garage binary
  get_url:
    url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/{{ garage_arch }}/garage"
    dest: /usr/local/bin/garage
    mode: "0755"

- name: Write Garage config
  template:
    src: garage.toml.j2
    dest: /etc/garage/garage.toml
    owner: garage
    group: garage
    mode: "0640"
  notify: restart garage

- name: Write Garage systemd service
  copy:
    dest: /etc/systemd/system/garage.service
    content: |
      [Unit]
      Description=Garage S3-compatible object storage
      After=network.target

      [Service]
      Type=simple
      User=garage
      Group=garage
      ExecStart=/usr/local/bin/garage -c /etc/garage/garage.toml server
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: restart garage

- name: Enable and start Garage
  systemd:
    name: garage
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Garage RPC to accept connections
  wait_for:
    host: 127.0.0.1
    port: "{{ garage_rpc_bind.split(':')[-1] }}"
    timeout: 30

- name: Read this node's Garage node ID
  # garage's default config search path is /etc/garage.toml — this role
  # writes it to /etc/garage/garage.toml instead (matching the systemd
  # unit's own explicit -c flag), so every bare `garage` CLI invocation
  # needs -c too or it fails with "Unable to read configuration file
  # /etc/garage.toml: No such file or directory".
  command: garage -c /etc/garage/garage.toml node id -q
  register: _garage_node_id_raw
  changed_when: false
  retries: 5
  delay: 3
  until: _garage_node_id_raw.rc == 0

- name: Expose the node ID as a fact for the cluster-bootstrap play
  set_fact:
    garage_node_id: "{{ _garage_node_id_raw.stdout | trim }}"
