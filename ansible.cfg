# ansible.cfg — Ansible configuration for this project
#
# This file is automatically picked up by Ansible when run from the repo root.
# It sets project-scoped defaults so every playbook run behaves consistently
# without requiring extra flags on the command line.
#
# run.sh always passes -i prod.ini to override the default inventory,
# so the inventory setting here only matters when running ansible-playbook
# directly without run.sh.
#
# Full reference for all available settings:
#   https://docs.ansible.com/ansible/latest/reference_appendices/config.html
#
# To see every active setting and where it comes from:
#   ansible-config dump --only-changed
#   ansible-config list

[defaults]

timeout = 15

# Use the system Python 3 interpreter on all managed nodes.
# Without this, Ansible may pick up an unexpected virtualenv or Python 2.
interpreter_python = /usr/bin/python3

# Path to the vault password file — loaded automatically so vault variables
# (like ansible_become_pass) are always available without --vault-password-file.
#vault_password_file = .vault_pass
vault_password_file = ~/.config/paradise/vault_pass

# Default inventory used when no -i flag is given.
# run.sh always overrides this with prod.ini (real IPs, gitignored).
# hosts.example.ini is the single template file — copy it to prod.ini before use.
inventory = inventory/hosts.example.ini

# Where Ansible looks for roles referenced in playbooks.
roles_path = ./roles

# Where Ansible looks for installed collections (ansible-galaxy collection install).
collections_path = ./collections

# Skip SSH host-key verification.
# Acceptable for a trusted home lab where nodes are known.
# Set to True in environments where MITM attacks are a real concern.
host_key_checking = False


[privilege_escalation]

# Run tasks as root by default (via sudo).
# Most system-level tasks (apt, systemd, file ownership) require root.
become = True

# Use sudo as the privilege escalation method (standard on Debian/Ubuntu).
become_method = sudo

# Escalate to root specifically.
become_user = root

# Do not prompt for a sudo password on subsequent runs.
# Passwordless sudo is configured automatically by the base_packages role
# (writes /etc/sudoers.d/<user> on each managed node).
#
# Bootstrap exception — the very first run against a fresh node has no
# passwordless sudo yet, so it must be invoked with --ask-become-pass:
#
#   ./run.sh homelab --ask-become-pass
#
# After that first run the sudoers file is in place and this flag takes effect.
become_ask_pass = False


[ssh_connection]

# Send multiple commands over a single SSH connection instead of one per task.
# Significantly reduces playbook run time on slow or high-latency links.
# Requires the remote user's shell to support it (bash/sh — always true here).
pipelining = True

ssh_args = -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2
