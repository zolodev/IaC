---
# Set up the Garage S3 node: k3s agent + Garage S3
#   ansible-playbook playbooks/setup-garage.yml

- name: Base configuration
  hosts: garage
  roles:
    - role: base_packages
    - role: auto_update
    - role: silent_motd
  tags: [base]

- name: Garage S3
  hosts: garage
  roles:
    - role: garage-s3
  tags: [garage]

- name: k3s agent
  hosts: garage
  roles:
    - role: k3s-agent
  tags: [k3s]
