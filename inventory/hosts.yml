---
all:
  children:

    # ── Ansible control node ──────────────────────────────────────────────────
    # The machine that runs Ansible and manages all other servers.
    ansible_controller:
      hosts:
        jetson:
          ansible_host: 192.168.1.x
          ansible_user: zolo

    # ── k3s control plane ────────────────────────────────────────────────────
    k3s_server:
      hosts:
        jetson:
          ansible_host: 192.168.1.x        # replace with Jetson IP
          ansible_user: zolo
          k3s_role: server

    # ── k3s agents ───────────────────────────────────────────────────────────
    k3s_agents:
      hosts:
        zh:
          ansible_host: 100.x.x.x          # Headscale IP for zh
          ansible_user: zolo
          k3s_role: agent

        zima-1:
          ansible_host: 192.168.1.x
          ansible_user: zolo
          k3s_role: agent

        zima-2:
          ansible_host: 192.168.1.x
          ansible_user: zolo
          k3s_role: agent

        zima-3:
          ansible_host: 192.168.1.x
          ansible_user: zolo
          k3s_role: agent

        zima-4:
          ansible_host: 192.168.1.x
          ansible_user: zolo
          k3s_role: agent

    # ── GPU nodes (subset of agents) ─────────────────────────────────────────
    gpu_nodes:
      hosts:
        jetson:

    # ── Garage S3 ─────────────────────────────────────────────────────────────
    garage:
      hosts:
        zh:

    # ── All home lab nodes ────────────────────────────────────────────────────
    homelab:
      children:
        k3s_server:
        k3s_agents:
