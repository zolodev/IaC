---
# Cleanly uninstall k3s (server and/or agent) from a node being repurposed —
# e.g. zyron/nova going from "k3s server" to "pure worker" in the new
# dedicated-core-servers architecture. Uses k3s's own official uninstall
# scripts, so it also tears down iptables rules, CNI interfaces, and data
# dirs correctly, not just the binary.
#
# Safe to run even if k3s (server or agent) was never installed on the
# target — each uninstall step is skipped if its script isn't present.
#
#   ansible-playbook playbooks/revert-k3s.yml --limit zyron
#   ansible-playbook playbooks/revert-k3s.yml --limit zyron,nova
#
# Runs every step in order, unconditionally. For manual step-by-step
# debugging where you want to comment out individual steps, use
# playbooks/k3s-uninstall-debug.yml instead, which imports these same step
# files (plus the tailscale-routes-guard checkpoints) one line at a time.

- name: Revert k3s installation
  hosts: homelab
  become: true
  tasks:
    - name: Tailscale route check — before uninstall
      ansible.builtin.include_role:
        name: tailscale-routes-guard
      vars:
        checkpoint: "revert-k3s: before uninstall"

    - name: Deploy local tailscale-route fix script
      ansible.builtin.include_role:
        name: tailscale-routes-guard
        tasks_from: deploy_local_fix.yml

    - import_tasks: ../roles/k3s-uninstall/tasks/steps/01_check_server_uninstall_script.yml
    - import_tasks: ../roles/k3s-uninstall/tasks/steps/02_uninstall_server.yml

    - name: Tailscale route check — after server uninstall
      ansible.builtin.include_role:
        name: tailscale-routes-guard
      vars:
        checkpoint: "revert-k3s: after server uninstall"
      when: k3s_server_uninstall is defined and k3s_server_uninstall.stat.exists

    - import_tasks: ../roles/k3s-uninstall/tasks/steps/03_check_agent_uninstall_script.yml
    - import_tasks: ../roles/k3s-uninstall/tasks/steps/04_uninstall_agent.yml

    - name: Tailscale route check — after agent uninstall
      ansible.builtin.include_role:
        name: tailscale-routes-guard
      vars:
        checkpoint: "revert-k3s: after agent uninstall"
      when: k3s_agent_uninstall is defined and k3s_agent_uninstall.stat.exists

    - import_tasks: ../roles/k3s-uninstall/tasks/steps/05_remove_kubeconfig.yml

    - name: Remove local tailscale-route fix script
      ansible.builtin.include_role:
        name: tailscale-routes-guard
        tasks_from: remove_local_fix.yml
