---
# Set up the Garage S3 node(s).
#   ansible-playbook playbooks/setup-garage.yml

- name: Base configuration
  hosts: garage
  roles:
    - role: base_packages
    - role: auto_update
    - role: silent_motd
  tags: [base]

- name: Garage S3
  hosts: garage
  roles:
    - role: garage-s3
  tags: [garage]

# k3s-agent is intentionally NOT applied here. It used to run
# unconditionally against every [garage] host, but every [garage] host in
# this inventory (zyron, nova) is already a full k3s_server — a k3s server
# already runs an embedded kubelet and is schedulable on its own, so
# additionally installing k3s-agent on it hits the exact same bug already
# fixed for the [k3s_agents] group: the agent install no-ops (k3s binary
# already present from the server install), so the k3s-agent systemd unit
# never actually gets created, and the next task fails with "Could not
# find the requested service k3s-agent". If a future [garage] host is ever
# added that ISN'T also a k3s_server, add k3s-agent back scoped to
# "garage:!k3s_server" specifically, not unconditionally.

- name: Garage cluster bootstrap (connect nodes + assign layout)
  hosts: garage
  run_once: true
  tags: [garage]
  tasks:
    - name: Skip — only one Garage node, no cluster to bootstrap
      debug:
        msg: "Single-node Garage (only {{ groups['garage'] | join(', ') }}) — replication_factor should be 1, nothing to connect."
      when: (groups['garage'] | length) < 2

    - name: Wait for every Garage node's RPC port to accept connections
      # garage-s3's "Write Garage config" task restarts the service via a
      # handler that fires at the END of that play, on every host at once
      # — this play starts right after with no synchronization point, so
      # the (possibly still-restarting) daemons aren't guaranteed to have
      # re-bound their RPC port yet. Since this whole play only actually
      # executes on one host (run_once), check every group member's port
      # from that host's perspective before trying to connect to any of
      # them.
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].k3s_node_ip | default(hostvars[item].ansible_host) }}"
        port: 3901
        timeout: 30
      loop: "{{ groups['garage'] }}"
      when: (groups['garage'] | length) > 1

    # garage's default config search path is /etc/garage.toml — the
    # garage-s3 role writes it to /etc/garage/garage.toml instead (matching
    # the systemd unit's own explicit -c flag), so every bare `garage` CLI
    # call below needs its own -c too, positioned before the subcommand.
    - name: Connect every Garage node to every other node
      ansible.builtin.command:
        cmd: "garage -c /etc/garage/garage.toml node connect {{ hostvars[item].garage_node_id }}"
      loop: "{{ groups['garage'] }}"
      when:
        - (groups['garage'] | length) > 1
        - item != inventory_hostname
      changed_when: true
      failed_when: false  # non-zero if already connected — harmless

    - name: Read current layout
      ansible.builtin.command: garage -c /etc/garage/garage.toml layout show
      register: _garage_layout
      changed_when: false
      when: (groups['garage'] | length) > 1

    - name: Assign zone + capacity for each node not yet in the layout
      # garage node connect completes the RPC handshake asynchronously —
      # a just-connected peer doesn't always show up in time for an
      # immediate `layout assign` ("Internal error: 0 nodes match ..."),
      # so retry rather than treat that as fatal.
      ansible.builtin.command:
        cmd: >
          garage -c /etc/garage/garage.toml layout assign {{ hostvars[item].garage_node_id.split('@')[0] }}
          -z {{ item }} -c {{ garage_node_capacity | default('100G') }}
      loop: "{{ groups['garage'] }}"
      when:
        - (groups['garage'] | length) > 1
        - hostvars[item].garage_node_id.split('@')[0] not in _garage_layout.stdout
      register: _garage_assign
      until: _garage_assign is not failed
      retries: 5
      delay: 3
      changed_when: true

    - name: Apply the staged layout
      ansible.builtin.shell: |
        set -euo pipefail
        CURRENT=$(garage -c /etc/garage/garage.toml layout show | grep -oP 'Current cluster layout version: \K\d+' || echo 0)
        garage -c /etc/garage/garage.toml layout apply --version $((CURRENT + 1))
      args:
        executable: /bin/bash
      register: _garage_layout_apply
      changed_when: "'Layout with version' in _garage_layout_apply.stdout"
      failed_when:
        - _garage_layout_apply.rc != 0
        - "'no cluster layout modifications' not in _garage_layout_apply.stderr | default('')"
      when: (groups['garage'] | length) > 1

- name: Garage bucket + key provisioning
  hosts: garage
  run_once: true
  tags: [garage]
  tasks:
    - name: Check existing Garage buckets
      ansible.builtin.command: garage -c /etc/garage/garage.toml bucket list
      register: _garage_buckets
      changed_when: false

    - name: Create bucket
      ansible.builtin.command: "garage -c /etc/garage/garage.toml bucket create {{ garage_paradise_bucket }}"
      when: garage_paradise_bucket not in _garage_buckets.stdout
      changed_when: true

    - name: Check existing Garage keys
      ansible.builtin.command: garage -c /etc/garage/garage.toml key list
      register: _garage_keys
      changed_when: false

    - name: Create key
      ansible.builtin.command: "garage -c /etc/garage/garage.toml key create {{ garage_paradise_key }}"
      when: garage_paradise_key not in _garage_keys.stdout
      changed_when: true

    - name: Grant key read/write/owner access to bucket
      # Safe to run every time — re-granting an already-held permission is
      # a no-op, and this also covers the case where the bucket/key already
      # existed from a previous run but the grant itself never happened.
      ansible.builtin.command: >
        garage -c /etc/garage/garage.toml bucket allow
        --read --write --owner {{ garage_paradise_bucket }} --key {{ garage_paradise_key }}
      changed_when: true

    - name: Read key credentials
      # --show-secret works on every call, not just at creation time (unlike
      # AWS), so this is safe to re-run and always reflects the real secret.
      ansible.builtin.command: "garage -c /etc/garage/garage.toml key info {{ garage_paradise_key }} --show-secret"
      register: _garage_key_info
      changed_when: false

    - name: Extract key ID and secret from key info output
      ansible.builtin.set_fact:
        _garage_paradise_key_id: "{{ (_garage_key_info.stdout_lines | select('match', 'Key ID:') | first).split(': ')[1] }}"
        _garage_paradise_secret_key: "{{ (_garage_key_info.stdout_lines | select('match', 'Secret key:') | first).split(': ')[1] }}"

    - name: Show paradise S3 credentials
      ansible.builtin.debug:
        msg: |
          Fill these into paradise/k8s/secret.yaml:
            S3_BUCKET: "{{ garage_paradise_bucket }}"
            S3_PREFIX: "paradise"
            S3_ENDPOINT_URL: "http://{{ hostvars[groups['garage'][0]].k3s_node_ip | default(hostvars[groups['garage'][0]].ansible_host) }}:3900"
            AWS_ACCESS_KEY_ID: "{{ _garage_paradise_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ _garage_paradise_secret_key }}"
            AWS_DEFAULT_REGION: "{{ garage_region }}"
